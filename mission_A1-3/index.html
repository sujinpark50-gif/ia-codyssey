<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레피 | 메모 몇 줄로 쓰는 상품 스토리</title>
  <meta name="description" content="사장님이 적은 메모에서 상품의 이야기를 찾아 상세페이지와 SNS 글로 정리해드려요. 없는 이야기는 만들지 않아요. 무료 베타 운영 중." />

  <!-- 카톡·슬랙 링크 미리보기용. 크롤러는 상대 경로를 못 읽으므로 절대 주소로 적는다.
       배포 루트가 mission_A1-3라 og-image.png는 도메인 바로 아래에 놓인다. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="레피(Lepi)" />
  <meta property="og:url" content="https://ia-codyssey-two.vercel.app/" />
  <meta property="og:title" content="레피 — 전하고 싶은 의미는 그대로, 표현은 더 선명하게." />
  <meta property="og:description" content="사장님이 적은 메모에서 상품의 이야기를 찾아 상세페이지와 SNS 글로 정리해드려요. 없는 이야기는 만들지 않아요. 무료 베타 운영 중." />
  <meta property="og:image" content="https://ia-codyssey-two.vercel.app/og-image.png" />
  <!-- 카톡은 크기를 명시하지 않으면 큰 카드 대신 작은 섬네일로 떨어뜨릴 때가 있다. -->
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="물건은 흔해도, 고른 이유는 저마다. 그 이유를 담아, 레피가 상품에 이야기를 입혀드려요." />
  <!-- 이미지가 생겼으므로 summary(작은 정사각 섬네일)에서 큰 카드로 올린다. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="레피 — 전하고 싶은 의미는 그대로, 표현은 더 선명하게." />
  <meta name="twitter:description" content="사장님이 적은 메모에서 상품의 이야기를 찾아 상세페이지와 SNS 글로 정리해드려요. 없는 이야기는 만들지 않아요. 무료 베타 운영 중." />
  <meta name="twitter:image" content="https://ia-codyssey-two.vercel.app/og-image.png" />
  <!-- 로고 "Lepi."의 마침표를 그대로 쓴 파비콘. 외부 파일 없이 SVG를 인라인으로
       넣어 요청을 하나 줄인다. 딥포레스트 바탕에 샌드 점(6.0:1). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23283618'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23DDA15E'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFDE5}
a{color:#283618}a:hover{color:#BC6C25}
.wrap{max-width:1200px;margin:0 auto;padding-left:24px;padding-right:24px;box-sizing:border-box}
.sec{padding-top:112px;padding-bottom:112px;border-top:1px solid #E0DEC4}
.sl{display:flex;align-items:center;gap:16px;margin:0 0 28px;font-size:12px;letter-spacing:.2em;color:#283618}
.sl-line{width:32px;height:1px;background:#283618;display:inline-block}
.sh{font-family:'Noto Serif KR',serif;font-weight:300;font-size:clamp(28px,3.6vw,44px);line-height:1.32;letter-spacing:-.015em;margin:0}
.lead{font-size:16px;line-height:1.85;color:#606C38;max-width:640px;margin:20px 0 0}
.label{font-size:12px;letter-spacing:.08em;color:#606C38}
.stack{display:grid}
.stack > *{grid-area:1/1;position:relative;z-index:0}
img.ov{z-index:1}
.logo{font-family:'Noto Serif KR',serif;font-weight:600;font-size:32px;letter-spacing:-.02em;text-decoration:none;color:#283618;display:inline-flex;align-items:baseline;line-height:1.3;padding-top:14px}
.logo:hover{color:#283618}
.logo .lt{padding:.08em 0 .34em;background-image:linear-gradient(90deg,var(--c) 0 50%,#283618 50% 100%);background-size:200% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;transition:background-position 520ms cubic-bezier(.16,1,.3,1) var(--d)}
.logo:hover .lt,.logo:focus-visible .lt{background-position:0 0}
.logo .seed{position:relative;display:inline-block;width:.19em;height:.19em;border-radius:50%;background:#BC6C25;margin-left:.13em}
.logo:hover .seed,.logo:focus-visible .seed{animation:lepiPop 480ms cubic-bezier(.34,1.56,.64,1) 420ms both}
@keyframes lepiPop{0%{transform:none}40%{transform:translateY(-5px) scale(1.3)}100%{transform:none}}
.logo .sprout{position:absolute;left:50%;bottom:62%;width:18px;height:20px;margin-left:-9px;overflow:visible;pointer-events:none}
.sprout .stem,.sprout .leaf{transform-box:fill-box;transition:transform 220ms ease}
.sprout .stem{transform-origin:50% 100%;transform:scaleY(0)}
.sprout .leaf-l{transform-origin:100% 100%;transform:scale(0)}
.sprout .leaf-r{transform-origin:0 100%;transform:scale(0)}
.logo:hover .sprout .stem,.logo:focus-visible .sprout .stem{transform:scaleY(1);transition:transform 420ms cubic-bezier(.16,1,.3,1) 820ms}
.logo:hover .sprout .leaf-l,.logo:focus-visible .sprout .leaf-l{transform:scale(1);transition:transform 520ms cubic-bezier(.34,1.56,.64,1) 1080ms}
.logo:hover .sprout .leaf-r,.logo:focus-visible .sprout .leaf-r{transform:scale(1);transition:transform 520ms cubic-bezier(.34,1.56,.64,1) 1200ms}
.draw{background-image:linear-gradient(#BC6C25,#BC6C25);background-repeat:no-repeat;background-position:0 92%;background-size:0% 2px;animation:lepiDraw 1100ms cubic-bezier(.16,1,.3,1) 700ms forwards}
@keyframes lepiDraw{to{background-size:100% 2px}}
.rise{opacity:0;transform:translateY(8px);animation:lepiRise 900ms cubic-bezier(.16,1,.3,1) forwards}
@keyframes lepiRise{to{opacity:1;transform:none}}
.hint-touch{display:none}
.bw{filter:grayscale(1) contrast(0.92)}
.ov{opacity:0}
@media (hover:none){.hint-touch{display:inline}.hint-mouse{display:none}}
.btn{font:inherit;font-size:16px;cursor:pointer;border-radius:999px;min-height:48px;padding:0 24px;transition:background-color 300ms ease,color 300ms ease,border-color 300ms ease;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn:focus-visible,.textbtn:focus-visible,.tab:focus-visible,.faq-q:focus-visible{outline:2px solid #BC6C25;outline-offset:3px}
.btn-solid{background:#283618;color:#FFFDE5;border:1px solid #283618}
.btn-solid:hover{background:#1B2510;color:#FFFDE5}
.btn-line{background:transparent;color:#283618;border:1px solid #93987C}
.btn-line:hover{border-color:#283618;color:#283618}
.textbtn{font:inherit;font-size:13px;background:none;border:0;padding:8px 0;min-height:44px;color:#606C38;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:#93987C}
.textbtn:hover{color:#283618}
.navlink{font-size:13px;color:#606C38;text-decoration:none;padding:12px 4px}
.navlink:hover{color:#283618}
.tab{font:inherit;font-size:15px;background:transparent;border:0;border-bottom:1px solid transparent;padding:10px 2px;min-height:44px;color:#606C38;cursor:pointer;transition:color 300ms ease,border-color 300ms ease}
.tab:hover{color:#283618}
.faq-q{font:inherit;width:100%;background:none;border:0;padding:26px 0;display:flex;align-items:center;gap:20px;text-align:left;cursor:pointer;color:#283618}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;color:#283618}
.field input,.field select,.field textarea{font:inherit;font-size:16px;color:#283618;background:#FFFFFF;border:1px solid #CFCCB0;border-radius:4px;padding:12px 14px;min-height:48px;box-sizing:border-box;transition:border-color 300ms ease}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#283618}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.draw{background-size:100% 2px}.rise{opacity:1;transform:none}}


/* PC 게시물 만들기 창 + 레피 확장 프로그램 시연. 모든 이름은 pd- 로 시작해 홈페이지와 섞이지 않게 함 */
.pd-root{--bg:#FFFDE5;--surface:#F7F0D2;--card:#FFFFFF;--fg:#283618;--muted:#606C38;--rule:#E0DEC4;--line:#93987C;--accent:#BC6C25;--ochre:#DDA15E;--dim:rgba(40,54,24,.42);--on:#FFFDE5;
  --serif:'Noto Serif KR','Apple SD Gothic Neo',serif;--sans:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
  font-family:var(--sans);color:var(--fg);word-break:keep-all}
.pd-stage{display:flex;flex-wrap:wrap;gap:40px 48px;align-items:center}
.pd-side{flex:0 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
.pd-label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.pd-steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pd-steps li{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule);transition:opacity 500ms var(--ease)}
.pd-n{font-family:var(--serif);color:var(--accent);font-size:15px;width:18px;flex:0 0 auto}
.pd-t{font-size:15px;line-height:1.55;background-image:linear-gradient(var(--muted),var(--muted));background-repeat:no-repeat;background-position:0 55%;background-size:0% 1px;transition:background-size 500ms var(--ease)}
.pd-steps li.pd-done{opacity:.45}
.pd-steps li.pd-done .pd-t{background-size:100% 1px}
.pd-steps li.pd-mine .pd-t{color:var(--accent);font-weight:500}
.pd-time{display:flex;gap:14px;align-items:baseline;padding:16px 18px;background:var(--bg);border:1px solid var(--rule);border-radius:4px}
.pd-timer{font-family:var(--serif);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums;flex:0 0 auto}
.pd-time span:last-child{font-size:14px;line-height:1.6}
.pd-note{font-size:13px;line-height:1.7;color:var(--muted);margin:0}

.pd-main{flex:1 1 600px;min-width:0;display:flex;flex-direction:column;gap:14px}
.pd-browser{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden;box-shadow:0 18px 44px rgba(40,54,24,.12)}
.pd-chrome{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--rule)}
.pd-dots{display:flex;gap:6px}.pd-dots i{width:10px;height:10px;border-radius:50%;background:var(--line);opacity:.5}
.pd-addr{flex:1;min-width:0;font-size:12px;color:var(--muted);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-ext{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;transition:background-color 300ms ease}
.pd-ext.pd-on{background:var(--rule)}
.pd-web{position:relative;background:var(--dim);padding:22px;display:flex;gap:0;min-height:430px}
.pd-modal{flex:1;min-width:0;background:var(--card);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:margin-right 500ms var(--ease)}
.pd-mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);font-size:15px;font-weight:500}
.pd-mhead .pd-back{font-size:20px;color:var(--fg);line-height:1}
.pd-share{justify-self:end;font:inherit;font-size:14px;font-weight:500;color:var(--accent);background:none;border:0;padding:6px 4px;cursor:pointer;border-radius:4px}
.pd-share:disabled{color:var(--line);cursor:default}
.pd-share.pd-pulse{animation:pdPulse 1.4s ease-in-out infinite}
@keyframes pdPulse{50%{background:rgba(188,108,37,.14)}}
.pd-mbody{display:flex;flex-wrap:wrap;flex:1;min-height:0}
.pd-photo{flex:1 1 300px;min-width:0;display:grid;background:var(--surface)}
.pd-photo > *{grid-area:1/1;position:relative;z-index:0}
.pd-photo img{width:100%;height:100%;min-height:260px;object-fit:cover;display:block;max-width:100%}
.pd-bw{filter:grayscale(1) contrast(.92)}
.pd-ov{z-index:1!important;opacity:0;transition:opacity 1400ms var(--ease)}
.pd-colored .pd-ov{opacity:1}
.pd-capcol{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--rule)}
.pd-acct{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font-size:14px;font-weight:500}
.pd-avatar{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.pd-capwrap{position:relative;flex:1;padding:4px 16px 12px;display:grid}
.pd-capwrap > *{grid-area:1/1;transition:opacity 500ms var(--ease),transform 600ms var(--ease)}
.pd-cap{font-size:14px;line-height:1.75;margin:0;cursor:text;user-select:text}
.pd-cap mark{background:transparent;color:inherit;transition:background-color 300ms ease}
.pd-cap.pd-sel mark{background:rgba(188,108,37,.22)}
.pd-cap.pd-hint{outline:1px dashed var(--line);outline-offset:6px;border-radius:2px;animation:pdHint 1.8s ease-in-out infinite}
@keyframes pdHint{50%{outline-color:var(--accent)}}
.pd-story h4{font-family:var(--serif);font-weight:400;font-size:15px;line-height:1.55;margin:0}
.pd-story p{font-size:14px;line-height:1.75;margin:6px 0 0}
.pd-count{font-size:12px;color:var(--line);text-align:right;padding:0 16px 12px;font-variant-numeric:tabular-nums}
.pd-hide{opacity:0;transform:translateY(6px);pointer-events:none}

.pd-menu{position:absolute;z-index:6;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 26px rgba(40,54,24,.16);padding:4px 0;font-size:13px;opacity:0;transform:scale(.97);transform-origin:0 0;pointer-events:none;transition:opacity 180ms ease,transform 180ms ease}
.pd-menu.pd-show{opacity:1;transform:none;pointer-events:auto}
.pd-menu div{padding:8px 14px;color:var(--muted)}
.pd-menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.pd-menu button{font:inherit;font-size:13px;width:100%;text-align:left;background:var(--surface);border:0;padding:9px 14px;color:var(--fg);display:flex;align-items:center;gap:8px;cursor:pointer}
.pd-menu button:hover,.pd-menu button:focus-visible{background:var(--rule);outline:none}

.pd-panel{position:absolute;top:0;right:0;bottom:0;width:300px;max-width:85%;background:var(--bg);border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:14px;padding:18px;box-sizing:border-box;transform:translateX(105%);transition:transform 550ms var(--ease);z-index:4;box-shadow:-12px 0 30px rgba(40,54,24,.10)}
.pd-panel.pd-show{transform:none}
.pd-phead{display:flex;align-items:baseline;justify-content:space-between}
.pd-logo{font-family:var(--serif);font-weight:600;font-size:20px}
.pd-logo b{color:var(--accent)}
.pd-tag{font-size:12px;color:var(--muted)}
.pd-bar{height:2px;background:var(--rule);position:relative;overflow:hidden}
.pd-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent);transition:width 900ms var(--ease)}
.pd-pbody{flex:1;min-height:0;overflow-y:auto;display:grid}
.pd-pbody > *{grid-area:1/1;transition:opacity 450ms var(--ease),transform 600ms var(--ease)}
.pd-stagetext{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;align-self:start}
.pd-stagetext i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.pd-result h4{font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.55;margin:0}
.pd-result p{font-size:13px;line-height:1.75;margin:6px 0 0}
.pd-pbtns{display:flex;gap:8px}
.pd-btn{font:inherit;font-size:14px;flex:1;min-height:42px;border-radius:999px;cursor:pointer;border:1px solid var(--fg);background:var(--fg);color:var(--on)}
.pd-btn.pd-line{background:transparent;color:var(--fg);border-color:var(--line)}
.pd-btn:disabled{opacity:.35;cursor:default}
.pd-btn:focus-visible,.pd-share:focus-visible,.pd-text:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.pd-posted{position:absolute;inset:22px;background:var(--card);border-radius:10px;display:flex;flex-wrap:wrap;overflow:hidden;opacity:0;pointer-events:none;transition:opacity 500ms var(--ease);z-index:3}
.pd-posted.pd-show{opacity:1;pointer-events:auto}
.pd-posted .pd-photo img{min-height:200px}
.pd-postcol{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-left:1px solid var(--rule);overflow-y:auto;max-height:100%;box-sizing:border-box}
.pd-comments{list-style:none;margin:6px 0 0;padding:10px 0 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.pd-comments li{font-size:13px;line-height:1.6;transition:opacity 500ms var(--ease),transform 500ms var(--ease)}
.pd-comments li b{font-weight:500;margin-right:6px}
.pd-comments li.pd-reply{padding-left:18px;color:var(--muted)}
.pd-comments li.pd-reply b{color:var(--fg)}
.pd-heart{width:24px;height:24px;display:block}
.pd-heart path{fill:transparent;stroke:var(--fg);stroke-width:1.6;transition:fill 250ms ease,stroke 250ms ease}
.pd-liked .pd-heart path{fill:var(--accent);stroke:var(--accent)}
.pd-liked .pd-heart{animation:pdPop 520ms cubic-bezier(.34,1.56,.64,1)}
@keyframes pdPop{40%{transform:scale(1.35)}}
.pd-likes{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.pd-postcap{font-size:13px;line-height:1.7;margin:0}
.pd-postcap b{font-weight:500;margin-right:6px}
.pd-toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-10px);background:var(--fg);color:var(--on);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity 400ms var(--ease),transform 500ms var(--ease);white-space:nowrap;z-index:7;pointer-events:none}
.pd-toast.pd-show{opacity:1;transform:translate(-50%,0)}
.pd-guide{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-height:44px}
.pd-guide p{margin:0;font-size:14px;color:var(--fg);display:flex;gap:10px;align-items:baseline}
.pd-guide b{font-family:var(--serif);font-weight:400;color:var(--accent)}
.pd-text{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:10px 4px;min-height:44px}
@media (max-width:640px){.pd-web{padding:12px;min-height:0}.pd-posted{inset:12px}.pd-capcol,.pd-postcol{border-left:0;border-top:1px solid var(--rule)}.pd-panel{width:88%}}
@media (prefers-reduced-motion:reduce){.pd-root *,.pd-root *::before,.pd-root *::after{transition-duration:1ms!important;transition-delay:0ms!important;animation:none!important}}
</style>
</head>

(function(){

function initBeta(){
  const WEBHOOK = "https://oclc-consisting-jenny-return.trycloudflare.com/webhook/d8fb407a-3c06-4358-a882-5a150d5672eb";
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest && e.target.closest('#betaBtn');
    if (!btn || btn.disabled) return;
    const $ = (id) => document.getElementById(id);
    const msg = $('betaMsg');
    const name = $('nm').value.trim(), category = $('biz').value, email = $('em').value.trim(), agree = $('agree').checked;
    if (!name || !category || !email || !agree) { msg.textContent = '이름, 업종, 이메일을 적고 참여 동의에 체크해 주세요.'; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = '이메일 주소를 다시 확인해 주세요.'; return; }
    btn.disabled = true; btn.textContent = '신청 중…'; msg.textContent = '';
    try {
      const r = await fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, category, sns: '', email, recent_post: '', agree }) });
      if (!r.ok) throw new Error('send failed');
      btn.textContent = '신청되었어요. 감사합니다';
      ['nm','biz','em','agree'].forEach((id) => { $(id).disabled = true; });
      msg.textContent = '정식으로 열리면 가장 먼저 알려드릴게요.';
    } catch (err) {
      btn.disabled = false; btn.textContent = '베타 신청하기';
      msg.textContent = '신청을 보내지 못했어요. 잠시 후 다시 시도해 주세요.';
    }
  });
}

function initPD(){
  const $ = (id) => document.getElementById(id);
  if (!$('pdcap') || $('pdcap').dataset.ready) return;
  $('pdcap').dataset.ready = '1';
  const steps = [...$('pdsteps').children];
  const cap = $('pdcap'), menu = $('pdmenu'), panel = $('pdpanel'), browser = $('pdbrowser');
  const resText = '예쁘진 않아도, 여행마다 따라다니면 추억이 되는 모자.\n\n주상절리를 걷다 햇볕에 지치셨다면, 입장할 때 받으신 5천 원 상품권을 들고 오세요. 저희 가게에서 바로 바꿔 드려요.\n\n솔직히 좀 못생겼어요. 그래도 여기에는 철원에서 보낸 그 더운 하루가 담겨요. 다른 곳으로 떠날 때 챙겨 쓰면, 그날 이야기가 덤으로 함께 가는 셈이죠.';
  let phase = 'idle', timers = [], acc = 0, t0 = 0, tick = null;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const show = (ms) => { $('pdtimer').textContent = (ms / 1000).toFixed(1) + '초'; };
  const go = () => { t0 = performance.now(); clearInterval(tick); tick = setInterval(() => show(acc + performance.now() - t0), 100); };
  const stop = () => { clearInterval(tick); acc += performance.now() - t0; show(acc); };
  const guide = (n, t) => { $('pdgnum').textContent = n; $('pdguide').textContent = t; };
  const stage = (t) => { $('pdstagetext').querySelector('span').textContent = t; };

  function openMenu(x, y){

    cap.classList.remove('pd-hint'); cap.classList.add('pd-sel');
    try { const r = document.createRange(); r.selectNodeContents(cap); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
    const b = browser.getBoundingClientRect();
    const left = Math.min(Math.max(8, x - b.left), b.width - 220), top = Math.min(Math.max(8, y - b.top), b.height - 175);
    menu.style.left = left + 'px'; menu.style.top = top + 'px';
    menu.classList.add('pd-show'); phase = 'menu';
    steps[0].classList.add('pd-done');

    $('pdlepi').focus({ preventScroll: true });
  }
  cap.addEventListener('mouseup', (e) => openMenu(e.clientX, e.clientY));
  cap.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(e.clientX, e.clientY); });
  cap.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const r = cap.getBoundingClientRect(); openMenu(r.left + 40, r.top + 40); } });

  $('pdlepi').addEventListener('click', () => {
    if (phase !== 'menu') return;
    phase = 'working'; menu.classList.remove('pd-show');
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    $('pdext').classList.add('pd-on'); panel.classList.add('pd-show'); go();
    guide(3, '레피가 메모 속 이야기를 찾아 정리하고 있어요.');

    later(() => {

      steps[2].classList.add('pd-done');

  });

  $('pdcopy').addEventListener('click', () => {

    try { navigator.clipboard.writeText(resText).then(done, done); } catch (e) { done(); }
  });

  $('pdinsert').addEventListener('click', () => {

  });
}

class Page extends Component {
  constructor(props) {

    this.state = { revealed: false, phase: 'idle', copied: false, ci: 0, cshown: true, crev: false, faq: 0, tried: false };
    this.timers = [];
  }
  componentDidMount() {
    try {
      ['images/lepi/hat-ov.webp','images/lepi/bell-ov.webp','images/lepi/karp-ov.webp','images/lepi/knicks-ov.webp'].forEach((u) => { const im = new Image(); im.decoding = 'async'; im.src = u; });
    } catch (e) {}
    try {
      if (window.matchMedia && window.matchMedia('(hover: none)').matches) {
        this.timers.push(setTimeout(() => this.setState({ revealed: true }), 3000));
      }
    } catch (e) {}
  }
  componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); }

    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }
  fade(on, delay, dur) {
    const ease = 'cubic-bezier(0.16,1,0.3,1)';
    const d = dur || 800;
    return 'opacity: ' + (on ? 1 : 0) + '; transform: translateY(' + (on ? 0 : 8) + 'px); transition: opacity ' + d + 'ms ' + ease + ' ' + delay + 'ms, transform ' + d + 'ms ' + ease + ' ' + delay + 'ms;';
  }
